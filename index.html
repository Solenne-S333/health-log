<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f141b" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Health Log" />
<script src="https://accounts.google.com/gsi/client" async defer></script>
<title>Health Log</title>
<style>
  :root{
    --bg:#f6f7f9; --surface:#ffffff; --surface-2:#eef1f5; --line:#dde2ea;
    --text:#141a22; --muted:#5b6672; --accent:#2f6df6; --accent-soft:#e6efff;
    --danger:#c8443c; --good:#1f9d63; --warn:#c98a12;
    --sym:#e0567a; --med:#7a5cf0; --bp:#c8443c; --sleep:#2b7fd4; --meal:#1f9d63; --mood:#0d9b8a; --soul:#c77d2e; --weight:#9c5c8f; --bowel:#8a6a4a;
    --s-mood:#0d9b8a; --s-energy:#c77d2e; --grid:rgba(20,26,34,.09); --axis:#98a2b0;
    --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.05);
    --tap:52px; --maxw:720px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f141b; --surface:#161d27; --surface-2:#1e2633; --line:#2a3543;
      --text:#e8edf4; --muted:#95a2b3; --accent:#5b8cff; --accent-soft:#1b2740;
      --danger:#f0736b; --good:#4cc389; --warn:#e0aa3e;
      --sym:#f07a9a; --med:#a48bff; --bp:#f0736b; --sleep:#5aa6ef; --meal:#4cc389; --mood:#3dc9b5; --soul:#e3a24f; --weight:#c184b3; --bowel:#b08a63;
      --s-mood:#22a08d; --s-energy:#c07f2e; --grid:rgba(232,237,244,.12); --axis:#7c8896;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-text-size-adjust:100%; padding-bottom:calc(72px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:var(--maxw); margin:0 auto; padding:16px 16px 8px;}
  h1{font-size:20px; margin:4px 0 2px; letter-spacing:-.01em}
  h2{font-size:16px; margin:20px 2px 10px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; font-weight:700}
  .sub{color:var(--muted); font-size:13px; margin:0 2px 14px}
  button{font-family:inherit; cursor:pointer}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}

  /* ---- Quick-log grid ---- */
  .modgrid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px}
  .modbtn{
    display:flex; flex-direction:column; align-items:flex-start; gap:6px;
    min-height:88px; padding:14px 14px; border:1px solid var(--line); border-radius:var(--radius);
    background:var(--surface); color:var(--text); text-align:left; box-shadow:var(--shadow);
    transition:transform .05s ease;
  }
  .modbtn:active{transform:scale(.98)}
  .modbtn .ico{font-size:24px; line-height:1}
  .modbtn .lbl{font-weight:700; font-size:16px}
  .modbtn .hint{font-size:12px; color:var(--muted)}
  .stripe{width:34px; height:4px; border-radius:3px; margin-top:2px}

  /* chips */
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin:2px 0 4px}
  .chip{
    border:1px solid var(--line); background:var(--surface-2); color:var(--text);
    border-radius:999px; padding:9px 13px; font-size:14px; font-weight:600; min-height:40px;
  }
  .chip:active{background:var(--accent-soft)}
  .chip.add{border-style:dashed; color:var(--muted); font-weight:500}
  .chip .meta{color:var(--muted); font-weight:500; font-size:12px; margin-left:6px}

  /* ---- Forms ---- */
  label{display:block; font-size:13px; font-weight:600; color:var(--muted); margin:12px 2px 5px}
  input,select,textarea{
    width:100%; font:inherit; color:var(--text); background:var(--surface);
    border:1px solid var(--line); border-radius:12px; padding:13px 12px; min-height:var(--tap);
  }
  textarea{min-height:76px; resize:vertical}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent); border-color:transparent}
  .row{display:flex; gap:10px}
  .row>div{flex:1}
  .inline{display:flex; gap:8px; flex-wrap:wrap}
  .seg{display:flex; gap:0; border:1px solid var(--line); border-radius:12px; overflow:hidden}
  .seg button{flex:1; border:0; background:var(--surface); color:var(--text); padding:12px 6px; min-height:var(--tap); font-weight:600; font-size:14px; border-right:1px solid var(--line)}
  .seg button:last-child{border-right:0}
  .seg button.on{background:var(--accent); color:#fff}
  .sevrow{display:flex; gap:6px; flex-wrap:wrap}
  .sev{width:44px; height:44px; border-radius:10px; border:1px solid var(--line); background:var(--surface); font-weight:700}
  .sev.on{background:var(--accent); color:#fff; border-color:transparent}
  .faces{display:flex; gap:8px}
  .face{flex:1; min-height:60px; border-radius:12px; border:1px solid var(--line); background:var(--surface); font-size:26px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px}
  .face .fl{font-size:10px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.03em}
  .face.on{background:var(--accent-soft); border-color:var(--accent)}
  .face.on .fl{color:var(--accent)}
  .actions{display:flex; gap:10px; margin-top:18px}
  .btn{flex:1; border:0; border-radius:12px; padding:15px; min-height:var(--tap); font-weight:700; font-size:16px}
  .btn.primary{background:var(--accent); color:#fff}
  .btn.ghost{background:var(--surface-2); color:var(--text)}
  .btn.small{flex:0 0 auto; padding:10px 14px; min-height:44px; font-size:14px}
  .btn.danger{background:transparent; color:var(--danger); border:1px solid var(--line)}
  fieldset{border:1px solid var(--line); border-radius:12px; margin:14px 0 0; padding:6px 12px 14px}
  legend{font-size:12px; font-weight:700; color:var(--muted); padding:0 6px; text-transform:uppercase; letter-spacing:.04em}
  .muted{color:var(--muted)}
  .hidden{display:none !important}

  /* ---- Timeline / entries ---- */
  .entry{display:flex; gap:12px; padding:13px 14px; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); margin-bottom:10px}
  .entry .bar{width:4px; border-radius:3px; flex:0 0 4px}
  .entry .body{flex:1; min-width:0}
  .entry .top{display:flex; justify-content:space-between; gap:10px; align-items:baseline}
  .entry .ttl{font-weight:700}
  .entry .when{font-size:12px; color:var(--muted); white-space:nowrap}
  .entry .det{font-size:14px; color:var(--text); margin-top:3px; word-wrap:break-word}
  .entry .note{font-size:13px; color:var(--muted); margin-top:4px; font-style:italic}
  .tag{display:inline-block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; padding:2px 7px; border-radius:6px; color:#fff}
  .daygroup{margin-top:6px}
  .dayhdr{font-size:13px; font-weight:700; color:var(--muted); margin:16px 4px 8px; position:sticky; top:0; background:var(--bg); padding:4px 0; z-index:1}
  .filterbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:6px}
  .fchip{border:1px solid var(--line); background:var(--surface); color:var(--muted); border-radius:999px; padding:7px 12px; font-size:13px; font-weight:600; min-height:38px}
  .fchip.on{background:var(--text); color:var(--bg); border-color:transparent}
  .empty{text-align:center; color:var(--muted); padding:40px 20px; font-size:14px}

  /* stats */
  .statgrid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}
  .stat{padding:12px 14px}
  .stat .k{font-size:12px; color:var(--muted); font-weight:600}
  .stat .v{font-size:22px; font-weight:800; letter-spacing:-.02em; margin-top:2px}
  .stat .s{font-size:12px; color:var(--muted)}

  /* ---- Nav ---- */
  nav{
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    background:var(--surface); border-top:1px solid var(--line);
    display:flex; padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  nav button{
    flex:1; background:none; border:0; color:var(--muted); padding:6px 2px; border-radius:10px;
    display:flex; flex-direction:column; align-items:center; gap:3px; font-size:11px; font-weight:600;
  }
  nav button .ni{font-size:20px; line-height:1}
  nav button.on{color:var(--accent)}

  /* modal */
  .sheet-back{position:fixed; inset:0; background:rgba(6,10,16,.5); z-index:100; display:flex; align-items:flex-end; justify-content:center}
  .sheet{background:var(--bg); width:100%; max-width:var(--maxw); max-height:92vh; overflow:auto; border-radius:18px 18px 0 0; padding:8px 16px calc(24px + env(safe-area-inset-bottom))}
  .sheet-hd{display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; background:var(--bg); padding:10px 2px 8px; z-index:2}
  .sheet-hd .x{background:var(--surface-2); border:0; width:38px; height:38px; border-radius:50%; font-size:18px; color:var(--text)}
  .grab{width:40px; height:4px; background:var(--line); border-radius:3px; margin:6px auto 2px}
  @media (min-width:560px){ .sheet-back{align-items:center} .sheet{border-radius:18px; margin:20px} }

  .toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(84px + env(safe-area-inset-bottom)); background:var(--text); color:var(--bg); padding:11px 18px; border-radius:999px; font-weight:600; font-size:14px; z-index:200; box-shadow:var(--shadow)}

  /* print / doctor summary */
  @media print{
    nav,.noprint{display:none !important}
    body{background:#fff; color:#000; padding:0}
    .wrap{max-width:100%}
    .card,.entry{box-shadow:none; border-color:#bbb}
    .dayhdr{position:static}
    a{color:#000}
  }
  .report h1{font-size:22px}
  .report table{width:100%; border-collapse:collapse; font-size:13px; margin:6px 0 14px}
  .report th,.report td{border:1px solid var(--line); padding:7px 9px; text-align:left; vertical-align:top}
  .report th{background:var(--surface-2); font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted)}
  .report caption{text-align:left; font-weight:700; margin:14px 0 6px; font-size:15px}

  /* trends / charts */
  .chartcard{padding:14px 14px 12px; margin-bottom:14px}
  .chartcard .ct{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:2px}
  .chartcard .ct h3{font-size:15px; margin:0; font-weight:700}
  .chartcard .ct .now{font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap}
  .chartcard .csub{font-size:12px; color:var(--muted); margin:0 0 10px}
  .chart{width:100%; height:auto; display:block; touch-action:pan-y}
  .chart .grid{stroke:var(--grid); stroke-width:1}
  .chart .axis{stroke:var(--axis); stroke-width:1; opacity:.5}
  .chart .albl{fill:var(--muted); font-size:9px; font-variant-numeric:tabular-nums}
  .chart .line{fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round}
  .chart .dot{stroke:var(--surface); stroke-width:1.5}
  .chart .hit{fill:transparent; cursor:pointer}
  .chart .bar{rx:2}
  .legend{display:flex; gap:14px; flex-wrap:wrap; margin-top:8px}
  .legend span{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); font-weight:600}
  .legend i{width:14px; height:0; border-top-width:2px; border-top-style:solid; display:inline-block}
  .charttip{position:fixed; z-index:300; background:var(--text); color:var(--bg); padding:7px 10px; border-radius:8px; font-size:12px; line-height:1.35; pointer-events:none; box-shadow:var(--shadow); max-width:230px; opacity:0; transition:opacity .08s}
  .charttip.on{opacity:1}
  .charttip b{font-weight:700}
  .insight{padding:13px 14px; margin-bottom:10px}
  .insight .ih{font-size:13px; font-weight:700; margin:0 0 8px}
  .cmp{display:flex; align-items:stretch; gap:10px}
  .cmp .side{flex:1; background:var(--surface-2); border-radius:10px; padding:9px 11px}
  .cmp .side .lb{font-size:11px; color:var(--muted); font-weight:600}
  .cmp .side .vv{font-size:20px; font-weight:800; letter-spacing:-.02em; font-variant-numeric:tabular-nums; margin-top:2px}
  .cmp .side .n{font-size:11px; color:var(--muted)}
  .delta{align-self:center; font-size:12px; font-weight:700; padding:3px 8px; border-radius:999px; white-space:nowrap}
  .delta.up{color:var(--good)} .delta.down{color:var(--danger)} .delta.flat{color:var(--muted)}
  .disclaim{font-size:12px; color:var(--muted); font-style:italic; margin:2px 2px 12px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<nav id="nav">
  <button data-tab="log" class="on"><span class="ni">➕</span>Log</button>
  <button data-tab="history"><span class="ni">🗂️</span>History</button>
  <button data-tab="correlate"><span class="ni">🔗</span>Correlate</button>
  <button data-tab="trends"><span class="ni">📈</span>Trends</button>
  <button data-tab="summary"><span class="ni">🩺</span>Summary</button>
  <button data-tab="settings"><span class="ni">⚙️</span>Settings</button>
</nav>

<script>
"use strict";
/* ============================================================
   Health Log — single-file offline personal health tracker.
   All data lives in this browser (localStorage). No network.
   ============================================================ */

const DB_KEY = "healthlog.v1";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const nowISO = () => new Date().toISOString();

const DEFAULT_DB = {
  symptoms: [],
  meds: [],          // definitions: {id,name,type,defaultDose}
  medDoses: [],      // {id, medId, takenAt, dose, notes, createdAt}
  bp: [],            // {id, takenAt, systolic, diastolic, pulse, notes, createdAt}
  sleep: [],         // {id, timestamp, hours, quality, notes, createdAt}
  meals: [],         // {id, timeEaten, location, source, size, description, mood, situation, drink{...}, after[], notes, createdAt}
  moods: [],         // {id, timestamp, rating(1-5), energy(1-5|null), tags[], notes, createdAt, updatedAt}
  soul: [],          // {id, timestamp, activity, durationMinutes, rating(1-5|null), notes, createdAt, updatedAt}
  weights: [],       // {id, timestamp, weight(number), unit("lb"|"kg"), notes, createdAt, updatedAt}
  bowel: [],         // {id, timestamp, bristol(1-7|null), flags[], notes, createdAt, updatedAt}
  weightUnit: "lb",
  commonSymptoms: ["Headache", "Fatigue", "Nausea", "Joint pain", "Dizziness", "Brain fog"],
  commonMoods: ["Calm", "Anxious", "Low", "Irritable", "Content", "Overwhelmed", "Hopeful", "Flat"],
  commonSoul: ["Kingdom tour", "Coffee ritual", "Time with Presence", "Plant tending", "Baking", "Journaling", "Meditation"],
  _deleted: {},      // { entryId: ISO time of deletion } — tombstones so deletes sync across devices
  _deletedChips: {}, // { listKey: { lowerValue: ISO } } — tombstones for removed chips (symptoms/moods/soul)
};
const MOOD_FACES = [ {v:1,e:"😞",l:"Awful"}, {v:2,e:"😕",l:"Low"}, {v:3,e:"😐",l:"Okay"}, {v:4,e:"🙂",l:"Good"}, {v:5,e:"😄",l:"Great"} ];

function load(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(!raw) return structuredClone(DEFAULT_DB);
    const d = JSON.parse(raw);
    return Object.assign(structuredClone(DEFAULT_DB), d);
  }catch(e){ console.warn("load failed", e); return structuredClone(DEFAULT_DB); }
}
let DB = load();
function save0(){ try{ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }catch(e){ toast("⚠️ Could not save — storage full?"); } }
function save(){ save0(); scheduleSync(); }
// Delete an entry AND leave a tombstone, so the deletion propagates through sync.
function removeById(key,id){ DB[key]=DB[key].filter(x=>x.id!==id); DB._deleted=DB._deleted||{}; DB._deleted[id]=nowISO(); }
// Chip lists (common symptoms/moods/soul) need tombstones too, or sync's union re-adds deletions.
function addChip(key, v){
  v=String(v||"").trim(); if(!v) return;
  if(!DB[key].some(c=>c.toLowerCase()===v.toLowerCase())) DB[key].push(v);
  if(DB._deletedChips && DB._deletedChips[key]) delete DB._deletedChips[key][v.toLowerCase()]; // re-adding un-deletes
}
function removeChip(key, i){
  const v=DB[key][i]; if(v==null) return;
  DB[key].splice(i,1);
  DB._deletedChips=DB._deletedChips||{}; DB._deletedChips[key]=DB._deletedChips[key]||{};
  DB._deletedChips[key][String(v).toLowerCase()]=nowISO();
}

/* ---------- helpers ---------- */
const MED_TYPES = ["Injection","Patch","Biologic","Eye drops","Other"];
const MEAL_SOURCES = ["Homemade","Takeout","Restaurant"];
const MEAL_SIZES = ["Small","Medium","Large"];

const pad = n => String(n).padStart(2,"0");
function toLocalInput(d){ // Date -> "YYYY-MM-DDTHH:MM" for datetime-local
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function nowLocalInput(){ return toLocalInput(new Date()); }
function fmtDateTime(iso){
  const d=new Date(iso);
  return d.toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
}
function fmtTime(iso){ return new Date(iso).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}); }
function fmtDay(iso){
  const d=new Date(iso), t=new Date();
  const same=(a,b)=>a.toDateString()===b.toDateString();
  if(same(d,t)) return "Today";
  const y=new Date(t); y.setDate(t.getDate()-1);
  if(same(d,y)) return "Yesterday";
  return d.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric",year:d.getFullYear()!==t.getFullYear()?"numeric":undefined});
}
function fmtDayShort(iso){ return new Date(iso).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}); }
function ago(iso){
  const ms=Date.now()-new Date(iso).getTime();
  const m=Math.round(ms/60000);
  if(m<1) return "just now";
  if(m<60) return m+"m ago";
  const h=Math.round(m/60);
  if(h<24) return h+"h ago";
  const d=Math.round(h/24);
  return d+"d ago";
}
function durHuman(min){
  if(min==null||min==="") return "";
  min=Number(min); if(isNaN(min)) return "";
  if(min<60) return min+" min";
  const h=Math.floor(min/60), m=min%60;
  return m? `${h}h ${m}m` : `${h}h`;
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function toast(msg){
  const t=document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),1900);
}

/* Unified event stream for history/correlate/summary.
   Each -> {id, type, ts(ISO), title, detail, note, module} */
function allEvents(){
  const ev=[];
  for(const s of DB.symptoms) ev.push({id:s.id,module:"symptom",ts:s.timestamp,
    title:s.name||"Symptom",
    detail:[s.severity!=null?`severity ${s.severity}/10`:"", durHuman(s.durationMinutes)].filter(Boolean).join(" · "),
    note:s.notes, raw:s});
  for(const d of DB.medDoses){ const m=DB.meds.find(x=>x.id===d.medId);
    ev.push({id:d.id,module:"med",ts:d.takenAt,
      title:(m?m.name:"Medication")+(m?` (${m.type})`:""),
      detail:d.dose?`dose: ${d.dose}`:"", note:d.notes, raw:d}); }
  for(const b of DB.bp) ev.push({id:b.id,module:"bp",ts:b.takenAt,
    title:`BP ${b.systolic}/${b.diastolic}`,
    detail:b.pulse?`pulse ${b.pulse}`:"", note:b.notes, raw:b});
  for(const s of DB.sleep) ev.push({id:s.id,module:"sleep",ts:s.timestamp,
    title:`Slept ${s.hours} h`,
    detail:s.quality?`quality ${s.quality}/5`:"", note:s.notes, raw:s});
  for(const m of DB.meals){
    const parts=[m.source,m.size&&m.size+" meal",m.location].filter(Boolean).join(" · ");
    const after=(m.after&&m.after.length)?"↳ after: "+m.after.map(a=>a.name+(a.durationMinutes?` (${durHuman(a.durationMinutes)})`:"")).join(", "):"";
    ev.push({id:m.id,module:"meal",ts:m.timeEaten,
      title:m.description||"Meal",
      detail:[parts, m.mood&&("mood: "+m.mood), m.drink&&m.drink.had&&("drink: "+[m.drink.what,m.drink.timing,m.drink.minutesBefore&&m.drink.minutesBefore+"m before"].filter(Boolean).join(" ")), m.situation, after].filter(Boolean).join(" · "),
      note:m.notes, raw:m});
  }
  for(const md of DB.moods) ev.push({id:md.id,module:"mood",ts:md.timestamp,
    title:`${moodFace(md.rating)} ${moodLabel(md.rating)}${md.rating?` (${md.rating}/5)`:""}`.trim(),
    detail:[ (md.tags&&md.tags.length)?md.tags.join(", "):"", md.energy?`energy ${md.energy}/5`:"" ].filter(Boolean).join(" · "),
    note:md.notes, raw:md});
  for(const so of DB.soul) ev.push({id:so.id,module:"soul",ts:so.timestamp,
    title:so.activity||"Soul time",
    detail:[ durHuman(so.durationMinutes), so.rating?`restoring ${so.rating}/5`:"" ].filter(Boolean).join(" · "),
    note:so.notes, raw:so});
  for(const w of DB.weights) ev.push({id:w.id,module:"weight",ts:w.timestamp,
    title:`${w.weight} ${w.unit||DB.weightUnit||"lb"}`,
    detail:"", note:w.notes, raw:w});
  for(const bm of DB.bowel) ev.push({id:bm.id,module:"bowel",ts:bm.timestamp,
    title:"Bowel movement"+(bm.bristol?` — type ${bm.bristol}`:""),
    detail:(bm.flags&&bm.flags.length)?bm.flags.join(", "):"", note:bm.notes, raw:bm});
  ev.sort((a,b)=> new Date(b.ts)-new Date(a.ts));
  return ev;
}

/* ============================================================

   ============================================================ */
function sheet(title, inner, onMount){
  const back=document.createElement("div"); back.className="sheet-back";
  back.innerHTML=`<div class="sheet">
    <div class="grab"></div>
    <div class="sheet-hd"><strong>${esc(title)}</strong><button class="x" aria-label="Close">✕</button></div>
    <div class="sheet-body">${inner}</div>
  </div>`;
  document.body.appendChild(back);
  const close=()=>back.remove();
  back.addEventListener("click",e=>{ if(e.target===back) close(); });
  back.querySelector(".x").addEventListener("click",close);
  back._close=close;
  if(onMount) onMount(back, close);
  return back;
}
function val(scope,id){ const el=scope.querySelector("#"+id); return el?el.value.trim():""; }

  const inner = `
    <label>Symptom</label>
    <div class="chips" id="symChips">
      ${DB.commonSymptoms.map(n=>`<button type="button" class="chip" data-n="${esc(n)}">${esc(n)}</button>`).join("")}
    </div>

    <div class="row">
      <div><label>Time noticed</label><input type="datetime-local" id="symTime" value="${s.timestamp?toLocalInput(new Date(s.timestamp)):(prefillTime?toLocalInput(new Date(prefillTime)):nowLocalInput())}" /></div>
      <div><label>Duration (min)</label><input type="number" inputmode="numeric" id="symDur" placeholder="optional" value="${s.durationMinutes??""}" /></div>
    </div>
    <label>Severity (1–10)</label>
    <div class="sevrow" id="symSev">
      ${Array.from({length:10},(_,i)=>i+1).map(n=>`<button type="button" class="sev ${sev===n?"on":""}" data-v="${n}">${n}</button>`).join("")}
    </div>
    <label>Notes</label>
    <textarea id="symNotes" placeholder="free text — what it felt like, triggers…">${esc(s.notes||"")}</textarea>
    ${existing?"":`<button class="btn ghost" id="okAnother" style="width:100%;margin-top:14px">Save &amp; add another symptom ＋</button>`}
    <div class="actions">
      ${existing?`<button class="btn danger small" id="del">Delete</button>`:""}
      <button class="btn ghost" id="cancel">Cancel</button>
      <button class="btn primary" id="ok">${existing?"Save":"Log symptom"}</button>
    </div>`;
  sheet(existing?"Edit symptom":"Log symptom", inner, (root,close)=>{
    let severity=sev;
    root.querySelectorAll("#symSev .sev").forEach(b=>b.onclick=()=>{
      severity=Number(b.dataset.v);
      root.querySelectorAll("#symSev .sev").forEach(x=>x.classList.toggle("on",x===b));
    });
    root.querySelectorAll("#symChips .chip").forEach(b=>b.onclick=()=>{ root.querySelector("#symName").value=b.dataset.n; });
    root.querySelector("#cancel").onclick=close;
    const delBtn=root.querySelector("#del"); if(delBtn) delBtn.onclick=()=>{ if(confirm("Delete this symptom entry?")){ removeById("symptoms",existing.id); save(); close(); render(); toast("Deleted"); } };
    const doSave=(again)=>{
      const name=val(root,"symName"); if(!name){ toast("Add a symptom name"); return; }
      const ts=new Date(root.querySelector("#symTime").value||Date.now()).toISOString();
      const rec={
        id: existing?existing.id:uid(),
        name,
        timestamp: ts,
        durationMinutes: val(root,"symDur")||null,
        severity,
        notes: val(root,"symNotes"),
        createdAt: existing?existing.createdAt:nowISO(), updatedAt:nowISO(),
      };
      if(existing){ const i=DB.symptoms.findIndex(x=>x.id===existing.id); DB.symptoms[i]=rec; }
      else DB.symptoms.push(rec);
      addChip("commonSymptoms", name); // learn (and un-tombstone) the symptom name
      save(); close(); toast("✓ Symptom logged");
      if(again) openSymptom(null, "", ts);   // reopen a fresh one at the SAME time
      else render();
    };
    root.querySelector("#ok").onclick=()=>doSave(false);
    const anBtn=root.querySelector("#okAnother"); if(anBtn) anBtn.onclick=()=>doSave(true);
  });
}

function openMed(existing=null, medId=null){
  if(DB.meds.length===0){
    sheet("No medications yet",`<p class="sub">Add your intermittent meds first (injections, patches, biologics, eye drops) in Settings — then logging a dose is one tap.</p>

      (root,close)=>{ root.querySelector("#cancel").onclick=close; root.querySelector("#go").onclick=()=>{close(); setTab("settings");}; });
    return;
  }
  const d=existing||{};
  const selMed = existing?existing.medId : (medId||DB.meds[0].id);
  const curMed = DB.meds.find(m=>m.id===selMed)||DB.meds[0];
  const inner=`
    <label>Medication</label>
    <select id="medSel">${DB.meds.map(m=>`<option value="${m.id}" ${m.id===selMed?"selected":""}>${esc(m.name)} — ${esc(m.type)}</option>`).join("")}</select>

    <div class="row">

      <div><label>Dose</label><input id="medDose" placeholder="e.g. 40 mg" value="${esc(d.dose|| (existing?"":curMed.defaultDose||""))}" /></div>
    </div>
    <label>Notes</label>
    <textarea id="medNotes" placeholder="site, side effects…">${esc(d.notes||"")}</textarea>
    <div class="actions">
      ${existing?`<button class="btn danger small" id="del">Delete</button>`:""}
      <button class="btn ghost" id="cancel">Cancel</button>
      <button class="btn primary" id="ok">${existing?"Save":"Log dose"}</button>
    </div>`;
  sheet(existing?"Edit dose":"Log dose", inner, (root,close)=>{
    const info=root.querySelector("#lastInfo");
    const upd=()=>{
      const id=root.querySelector("#medSel").value;
      const last=lastDose(id);
      const m=DB.meds.find(x=>x.id===id);

    };
    upd();
    root.querySelector("#medSel").onchange=upd;
    root.querySelector("#cancel").onclick=close;
    const delBtn=root.querySelector("#del"); if(delBtn) delBtn.onclick=()=>{ if(confirm("Delete this dose?")){ removeById("medDoses",existing.id); save(); close(); render(); toast("Deleted"); } };
    root.querySelector("#ok").onclick=()=>{
      const rec={
        id: existing?existing.id:uid(),
        medId: root.querySelector("#medSel").value,
        takenAt: new Date(root.querySelector("#medTime").value||Date.now()).toISOString(),
        dose: val(root,"medDose"),
        notes: val(root,"medNotes"),
        createdAt: existing?existing.createdAt:nowISO(),
      };
      if(existing){ const i=DB.medDoses.findIndex(x=>x.id===existing.id); DB.medDoses[i]=rec; }
      else DB.medDoses.push(rec);
      save(); close(); render(); toast("✓ Dose logged");
    };
  });
}

      <p class="sub" style="margin:8px 2px 0">These also get saved as symptom entries so they show up in correlations.</p>

    const wire=(id,key)=>root.querySelectorAll("#"+id+" button").forEach(b=>b.onclick=()=>{
      state[key]=b.dataset.v; root.querySelectorAll("#"+id+" button").forEach(x=>x.classList.toggle("on",x===b));
    });
    wire("mlSrc","src"); wire("mlSize","size"); wire("mlTiming","timing");
    root.querySelectorAll("#mlHad button").forEach(b=>b.onclick=()=>{
      state.had=b.dataset.v==="yes";
      root.querySelectorAll("#mlHad button").forEach(x=>x.classList.toggle("on",x===b));

    });

    root.querySelector("#addAfter").onclick=()=>{
      const i=listEl.children.length;
      const div=document.createElement("div"); div.innerHTML=afterRow({},i); listEl.appendChild(div.firstElementChild);
      wireAfterRemoval(listEl);
    };
    wireAfterRemoval(listEl);
    root.querySelector("#cancel").onclick=close;
    const delBtn=root.querySelector("#del"); if(delBtn) delBtn.onclick=()=>{ if(confirm("Delete this meal entry? (Linked after-symptoms stay unless you delete them.)")){ removeById("meals",existing.id); save(); close(); render(); toast("Deleted"); } };

        location:val(root,"mlLoc"),

        mood:val(root,"mlMood"), situation:val(root,"mlSit"),

        after: afterArr,
        notes:val(root,"mlNotes"),
        createdAt:existing?existing.createdAt:nowISO(), updatedAt:nowISO(),
      };
      // Rebuild linked symptom entries (tagged with mealId) with STABLE ids so edits + sync dedupe cleanly.
      const oldLinks=DB.symptoms.filter(s=>s.mealId===rec.id).map(s=>s.id);
      DB.symptoms = DB.symptoms.filter(s=>s.mealId!==rec.id);
      const newIds=[];
      afterArr.forEach((a,idx)=>{
        const sid=`${rec.id}-after-${idx}`; newIds.push(sid);
        DB.symptoms.push({ id:sid, name:a.name, timestamp:timeEaten, durationMinutes:a.durationMinutes,
          severity:null, notes:`After meal: ${rec.description||"(meal)"}`, mealId:rec.id, createdAt:nowISO(), updatedAt:nowISO() });
        addChip("commonSymptoms", a.name);
      });
      DB._deleted=DB._deleted||{};
      oldLinks.forEach(oid=>{ if(!newIds.includes(oid)) DB._deleted[oid]=nowISO(); });
      if(existing){ const i=DB.meals.findIndex(x=>x.id===existing.id); DB.meals[i]=rec; } else DB.meals.push(rec);
      save(); close(); render(); toast("✓ Meal context logged");
    };
  });
}

/* ============================================================
   HISTORY
   ============================================================ */
let histFilter=new Set(); // empty = all
function renderHistory(){
  let ev=allEvents();
  const active=histFilter;
  if(active.size) ev=ev.filter(e=>active.has(e.module));
  // group by day
  const groups={};
  ev.forEach(e=>{ const k=new Date(e.ts).toDateString(); (groups[k]=groups[k]||[]).push(e); });
  const keys=Object.keys(groups);
  app().innerHTML=`
    <h1>History</h1>
    <p class="sub">${ev.length} entr${ev.length===1?"y":"ies"}${active.size?` · filtered`:""}. Tap any entry to edit.</p>
    <div class="filterbar">
      <button class="fchip ${active.size===0?"on":""}" onclick="toggleFilter('')">All</button>
      ${Object.keys(MOD).map(k=>`<button class="fchip ${active.has(k)?"on":""}" onclick="toggleFilter('${k}')">${MOD[k].ico} ${MOD[k].label}</button>`).join("")}
    </div>
    ${keys.length? keys.map(k=>{
      const dayIso=groups[k][0].ts;
      return `<div class="daygroup"><div class="dayhdr">${fmtDay(dayIso)}</div>${groups[k].map(entryHTML).join("")}</div>`;
    }).join("") : `<div class="empty">No entries yet.<br>Head to <b>Log</b> to add your first.</div>`}
  `;
}
function toggleFilter(k){
  if(k===""){ histFilter.clear(); }
  else{ histFilter.has(k)?histFilter.delete(k):histFilter.add(k); }
  renderHistory();
}

/* ============================================================
   CORRELATE
   ============================================================ */
let corr={days:14, mods:new Set(["symptom","meal","med","mood"])};
function renderCorrelate(){
  const since=new Date(); since.setDate(since.getDate()-corr.days); since.setHours(0,0,0,0);
  let ev=allEvents().filter(e=>new Date(e.ts)>=since && corr.mods.has(e.module));
  const groups={};
  ev.forEach(e=>{ const k=new Date(e.ts).toDateString(); (groups[k]=groups[k]||[]).push(e); });
  const keys=Object.keys(groups); // already newest-first from allEvents order
  app().innerHTML=`
    <h1>Correlate</h1>
    <p class="sub">See chosen modules together on one timeline to spot patterns.</p>
    <label>Date range</label>
    <div class="filterbar">
      ${[7,14,30,90].map(d=>`<button class="fchip ${corr.days===d?"on":""}" onclick="setCorrDays(${d})">${d} days</button>`).join("")}
    </div>
    <label>Show</label>
    <div class="filterbar">
      ${Object.keys(MOD).map(k=>`<button class="fchip ${corr.mods.has(k)?"on":""}" onclick="toggleCorr('${k}')">${MOD[k].ico} ${MOD[k].label}</button>`).join("")}
    </div>
    <p class="sub" style="margin-top:12px">${ev.length} entr${ev.length===1?"y":"ies"} in the last ${corr.days} days.</p>

      return `<div class="daygroup"><div class="dayhdr">${fmtDay(groups[k][0].ts)}</div>${items.map(entryHTML).join("")}</div>`;
    }).join("") : `<div class="empty">Nothing in this range.</div>`}
  `;
}
function setCorrDays(d){ corr.days=d; renderCorrelate(); }
function toggleCorr(k){ corr.mods.has(k)?corr.mods.delete(k):corr.mods.add(k); if(corr.mods.size===0) corr.mods.add(k); renderCorrelate(); }

/* ============================================================
   TRENDS  (dependency-free inline-SVG charts + pattern cards)
   ============================================================ */
let trend={days:30};
const CW=340,CH=120,PL=26,PR=10,PT=10,PB=16;
const PX0=PL,PX1=CW-PR,PY0=PT,PY1=CH-PB;
let TIPREG={}, TIP_N=0;
function regTip(html){ const id="tp"+(TIP_N++); TIPREG[id]=html; return id; }
function xAt(i,n){ return n<=1?(PX0+PX1)/2 : PX0+(PX1-PX0)*i/(n-1); }
function yAt(v,mn,mx){ return PY1-(PY1-PY0)*((v-mn)/((mx-mn)||1)); }
function round1(x){ return Math.round(x*10)/10; }

function dailyAgg(from,to){
  const days=[]; let d=new Date(from); d.setHours(0,0,0,0);
  const end=new Date(to); end.setHours(0,0,0,0);
  while(d<=end){ days.push(new Date(d)); d.setDate(d.getDate()+1); }
  const map={}; const K=x=>new Date(x).toDateString();
  days.forEach(dd=>map[dd.toDateString()]={date:dd,moods:[],energy:[],symCount:0,symSev:[],symNames:[],sleepH:null,sleepQ:null,sys:[],dia:[],pulse:[],soulMin:0,soulCount:0,weights:[],bowel:0,bristol:[]});
  const wUnit=DB.weightUnit||"lb";
  const toU=w=>{ const u=w.unit||wUnit; return u===wUnit? Number(w.weight) : (u==="kg"? Number(w.weight)*2.20462 : Number(w.weight)/2.20462); };
  DB.weights.forEach(w=>{const k=K(w.timestamp); if(map[k]) map[k].weights.push(toU(w));});
  DB.bowel.forEach(x=>{const k=K(x.timestamp); if(map[k]){ map[k].bowel++; if(x.bristol) map[k].bristol.push(x.bristol); }});
  DB.moods.forEach(m=>{const k=K(m.timestamp); if(map[k]){ if(m.rating!=null)map[k].moods.push(m.rating); if(m.energy!=null)map[k].energy.push(m.energy);} });
  DB.symptoms.forEach(s=>{const k=K(s.timestamp); if(map[k]){ map[k].symCount++; if(s.severity!=null)map[k].symSev.push(Number(s.severity)); map[k].symNames.push(s.name);} });
  DB.sleep.forEach(s=>{const k=K(s.timestamp); if(map[k]){ map[k].sleepH=(map[k].sleepH||0)+Number(s.hours||0); if(s.quality!=null)map[k].sleepQ=s.quality;} });
  DB.bp.forEach(b=>{const k=K(b.takenAt); if(map[k]){ map[k].sys.push(b.systolic); map[k].dia.push(b.diastolic); if(b.pulse!=null)map[k].pulse.push(b.pulse);} });
  DB.soul.forEach(s=>{const k=K(s.timestamp); if(map[k]){ map[k].soulMin+=Number(s.durationMinutes||0); map[k].soulCount++;} });
  return days.map(dd=>map[dd.toDateString()]);
}
function fmtMD(d){ return new Date(d).toLocaleDateString(undefined,{month:"numeric",day:"numeric"}); }
function xAxisLabels(days){
  const n=days.length; if(!n) return "";
  const idxs = n<=1?[0] : n<=3?days.map((_,i)=>i) : [0,Math.floor((n-1)/2),n-1];
  return idxs.map(i=>`<text class="albl" x="${xAt(i,n).toFixed(1)}" y="${CH-4}" text-anchor="${i===0?"start":i===n-1?"end":"middle"}">${fmtMD(days[i].date)}</text>`).join("");
}
function gridY(mn,mx,fmt){
  const ticks=[mn,(mn+mx)/2,mx];
  return ticks.map(t=>{ const y=yAt(t,mn,mx);
    return `<line class="grid" x1="${PX0}" y1="${y.toFixed(1)}" x2="${PX1}" y2="${y.toFixed(1)}"/><text class="albl" x="${PX0-4}" y="${(y+3).toFixed(1)}" text-anchor="end">${fmt(t)}</text>`;
  }).join("");
}

// LINE chart: series=[{label,color,dash,vals:[num|null]}], domain [mn,mx]
function lineChart(days,series,mn,mx,fmtY,unit){
  const n=days.length;
  const grid=gridY(mn,mx,fmtY);
  let paths="",dots="";
  series.forEach(s=>{
    let dpath="",pen=false;
    s.vals.forEach((v,i)=>{ if(v==null){pen=false;return;} const x=xAt(i,n),y=yAt(v,mn,mx); dpath+=(pen?"L":"M")+x.toFixed(1)+" "+y.toFixed(1)+" "; pen=true;
      dots+=`<circle class="dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="${s.color}"/>`; });
    paths+=`<path class="line" d="${dpath.trim()}" stroke="${s.color}" ${s.dash?'stroke-dasharray="4 3"':""}/>`;
  });
  // hover bands (one per day that has any value)
  let hits="";
  const bw=(PX1-PX0)/Math.max(n,1);
  days.forEach((d,i)=>{
    const has=series.some(s=>s.vals[i]!=null); if(!has) return;
    const cx=xAt(i,n);
    const rows=series.map(s=>s.vals[i]!=null?`<b style="color:${s.color}">■</b> ${s.label}: <b>${round1(s.vals[i])}${unit||""}</b>`:"").filter(Boolean).join("<br>");
    const id=regTip(`<b>${fmtDayShort(d.date)}</b><br>${rows}`);
    hits+=`<rect class="hit" data-tip="${id}" data-cx="${cx.toFixed(1)}" x="${(cx-bw/2).toFixed(1)}" y="${PY0}" width="${bw.toFixed(1)}" height="${PY1-PY0}"/>`;
  });
  return svgWrap(grid,paths+dots,hits,days);
}
// BAR chart: vals:[num], baseline at 0 (or mn), color
function barChart(days,vals,mn,mx,color,fmtY,tipFn){
  const n=days.length;
  const grid=gridY(mn,mx,fmtY);
  const bw=(PX1-PX0)/Math.max(n,1);
  let bars="",hits="";
  const y0=yAt(Math.max(mn,0),mn,mx);
  days.forEach((d,i)=>{
    const v=vals[i]; const cx=xAt(i,n);
    if(v!=null && v>mn){ const y=yAt(v,mn,mx); const w=Math.max(2,bw*0.6);
      bars+=`<rect class="bar" x="${(cx-w/2).toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(0,y0-y).toFixed(1)}" rx="2" fill="${color}"/>`; }
    const id=regTip(tipFn(d,v));
    hits+=`<rect class="hit" data-tip="${id}" data-cx="${cx.toFixed(1)}" x="${(cx-bw/2).toFixed(1)}" y="${PY0}" width="${bw.toFixed(1)}" height="${PY1-PY0}"/>`;
  });
  return svgWrap(grid,bars,hits,days);
}
function svgWrap(grid,marks,hits,days){
  return `<svg class="chart js-chart" viewBox="0 0 ${CW} ${CH}" role="img">
    <line class="axis" x1="${PX0}" y1="${PY1}" x2="${PX1}" y2="${PY1}"/>
    ${grid}
    <line class="cross" x1="0" y1="${PY0}" x2="0" y2="${PY1}" stroke="var(--axis)" stroke-width="1" stroke-dasharray="3 3" style="display:none"/>
    ${marks}
    ${xAxisLabels(days)}
    ${hits}
  </svg>`;
}
function legend(items){ return `<div class="legend">${items.map(it=>`<span><i style="border-top-color:${it.color}${it.dash?"; border-top-style:dashed":""}"></i>${esc(it.label)}</span>`).join("")}</div>`; }

function niceTop(v,min){ v=Math.max(v,min); const step=v<=5?1:v<=10?2:v<=30?5:v<=60?10:v<=180?30:60; return Math.ceil(v/step)*step||step; }

/* Early-signal pattern cards: bucket days and compare. Association, not proof. */
function patternCards(days){
  // Only compare days you actually tracked — untracked days aren't "zero", they're unknown.
  const active=days.filter(d=>d.moods.length||d.energy.length||d.symCount||d.sleepH!=null||d.sys.length||d.soulCount);
  const withSoul=active.filter(d=>d.soulCount>0), noSoul=active.filter(d=>d.soulCount===0);
  const cards=[];
  // Mood on soul-time days vs not
  cards.push(cmpCard("Mood on soul-time days",
    "Soul time", avg(withSoul.flatMap(d=>d.moods)), withSoul.filter(d=>d.moods.length).length,
    "No soul time", avg(noSoul.flatMap(d=>d.moods)), noSoul.filter(d=>d.moods.length).length,
    "/5", true));
  // Symptoms on soul-time days vs not
  cards.push(cmpCard("Symptoms on soul-time days",
    "Soul time", avg(withSoul.map(d=>d.symCount)), withSoul.length,
    "No soul time", avg(noSoul.map(d=>d.symCount)), noSoul.length,
    "/day", false));
  // Mood by sleep quantity
  const goodSleep=active.filter(d=>d.sleepH!=null&&d.sleepH>=7), shortSleep=active.filter(d=>d.sleepH!=null&&d.sleepH<6);
  cards.push(cmpCard("Mood by sleep",
    "Slept ≥7h", avg(goodSleep.flatMap(d=>d.moods)), goodSleep.filter(d=>d.moods.length).length,
    "Slept <6h", avg(shortSleep.flatMap(d=>d.moods)), shortSleep.filter(d=>d.moods.length).length,
    "/5", true));
  const shown=cards.filter(Boolean);
  if(!shown.length) return "";
  return `<h2>Early signals</h2><p class="disclaim">These compare your own days side by side — associations to explore with your doctor, not proof of cause. Small samples wobble.</p>${shown.join("")}`;
}
function cmpCard(title,lblA,a,nA,lblB,b,nB,unit,higherBetter){
  if(a==null||b==null||nA<2||nB<2) return ""; // need enough on both sides
  const diff=a-b; const dir=Math.abs(diff)<0.05?"flat":diff>0?"up":"down";
  const good = higherBetter? diff>0 : diff<0;
  const cls = dir==="flat"?"flat":good?"up":"down";
  const arrow = dir==="flat"?"≈":diff>0?"▲":"▼";
  return `<div class="insight card">
    <p class="ih">${title}</p>
    <div class="cmp">
      <div class="side"><div class="lb">${esc(lblA)}</div><div class="vv">${round1(a)}${unit}</div><div class="n">${nA} day${nA===1?"":"s"}</div></div>
      <div class="delta ${cls}">${arrow} ${round1(Math.abs(diff))}${unit}</div>
      <div class="side"><div class="lb">${esc(lblB)}</div><div class="vv">${round1(b)}${unit}</div><div class="n">${nB} day${nB===1?"":"s"}</div></div>
    </div>
  </div>`;
}

/* Tooltip + crosshair wiring for charts */
function wireCharts(){
  let tip=document.getElementById("charttip");
  if(!tip){ tip=document.createElement("div"); tip.id="charttip"; tip.className="charttip"; document.body.appendChild(tip); }
  const move=(e,el)=>{
    const id=el.getAttribute("data-tip"); const html=TIPREG[id]; if(!html) return;
    tip.innerHTML=html; tip.classList.add("on");
    const px=(e.touches?e.touches[0].clientX:e.clientX), py=(e.touches?e.touches[0].clientY:e.clientY);
    const w=tip.offsetWidth, h=tip.offsetHeight;
    let x=px+12, y=py-h-12; if(x+w>window.innerWidth-8) x=px-w-12; if(y<8) y=py+16;
    tip.style.left=x+"px"; tip.style.top=y+"px";
    const svg=el.closest("svg"); const cross=svg&&svg.querySelector(".cross");
    if(cross){ const cx=el.getAttribute("data-cx"); cross.setAttribute("x1",cx); cross.setAttribute("x2",cx); cross.style.display=""; }
  };
  const hide=(el)=>{ tip.classList.remove("on"); const svg=el.closest("svg"); const cross=svg&&svg.querySelector(".cross"); if(cross) cross.style.display="none"; };
  app().querySelectorAll(".js-chart .hit").forEach(el=>{
    el.addEventListener("pointerenter",e=>move(e,el));
    el.addEventListener("pointermove",e=>move(e,el));
    el.addEventListener("pointerleave",()=>hide(el));
    el.addEventListener("touchstart",e=>move(e,el),{passive:true});
    el.addEventListener("touchmove",e=>move(e,el),{passive:true});
    el.addEventListener("touchend",()=>hide(el));
  });
}

   ADD FROM CLAUDE  (merge a scribe-produced block, additively)
   ============================================================ */
const INGEST_LABEL={symptoms:"symptoms",medDoses:"med doses",bp:"BP readings",sleep:"sleep",meals:"meals",moods:"moods",soul:"soul time",weights:"weigh-ins",bowel:"bowel movements"};
function mergeArray(targetKey, incoming){
  const target=DB[targetKey]; let added=0;
  incoming.forEach(item=>{
    if(!item||typeof item!=="object") return;
    if(!item.id) item.id=uid();
    if(!item.createdAt) item.createdAt=nowISO();
    const i=target.findIndex(x=>x.id===item.id);
    if(i>=0) target[i]=Object.assign({},target[i],item);
    else { target.push(item); added++; }
  });
  return added;
}
function unionCommon(key, incoming){
  incoming.forEach(v=>{ if(v && !DB[key].some(t=>t.toLowerCase()===String(v).toLowerCase())) DB[key].push(String(v)); });
}
function mergeMeds(incoming){
  incoming.forEach(m=>{ if(!m||!m.name) return;
    if(DB.meds.some(x=>x.name.toLowerCase()===m.name.toLowerCase())) return;
    DB.meds.push({id:m.id||uid(), name:m.name, type:m.type||"Other", defaultDose:m.defaultDose||""}); });
}
function ingestFromClaude(){
  const ta=document.getElementById("claudePaste"); if(!ta) return;
  let raw=ta.value.trim();
  if(!raw){ toast("Paste the block from Claude first"); return; }
  raw=raw.replace(/^```[a-z]*\s*/i,"").replace(/```\s*$/,"").trim();  // tolerate code fences
  let obj;
  try{ obj=JSON.parse(raw); }catch(e){ toast("⚠️ That doesn't look like a valid block"); return; }
  const src = (obj.add && typeof obj.add==="object") ? obj.add : obj;
  let total=0; const parts=[];
  Object.keys(INGEST_LABEL).forEach(k=>{
    if(Array.isArray(src[k])){ const n=mergeArray(k, src[k]); if(n){ total+=n; parts.push(`${n} ${INGEST_LABEL[k]}`); } }
  });
  ["commonSymptoms","commonMoods","commonSoul"].forEach(k=>{ const inc=obj[k]||src[k]; if(Array.isArray(inc)) unionCommon(k, inc); });
  const meds=obj.meds||src.meds; if(Array.isArray(meds)) mergeMeds(meds);
  if(!total){ toast("Nothing new to add (already logged?)"); return; }
  save(); ta.value="";
  render(); setTab("history");
  toast(`✓ Added ${total} entr${total===1?"y":"ies"}`);
  setTimeout(()=>alert("Filed:\n• "+parts.join("\n• ")),50);
}

   storage pressure or a routine clear. Best-effort: some browsers only grant it

async function requestPersistentStorage(){

/* ============================================================
   GOOGLE DRIVE SYNC  (phone <-> laptop, via the user's own Drive)
   Scope: drive.file — the app can only see files it creates.
   ============================================================ */
const SYNC = { connected:false, status:null, _resolve:null, _reject:null };
const SYNC_ARRAYS = ["symptoms","meds","medDoses","bp","sleep","meals","moods","soul","weights","bowel"];
const DRIVE_FILE = "health-log-data.json";
let accessToken=null, tokenExpiry=0, tokenClient=null, syncing=false, syncTimer=null;

function getClientId(){ return (localStorage.getItem("healthlog.clientId")||"").trim(); }
function setClientId(v){ localStorage.setItem("healthlog.clientId",(v||"").trim()); }

/* Conflict-safe merge: union every entry by id (newer updatedAt wins),
   honor tombstones so deletions stick, union the chip lists. */
function mergeDB(local, remote){
  const out = structuredClone(local);
  const td = {};
  [local._deleted||{}, remote._deleted||{}].forEach(src=>{ for(const id in src){ if(!td[id] || new Date(src[id])>new Date(td[id])) td[id]=src[id]; } });
  out._deleted = td;
  SYNC_ARRAYS.forEach(k=>{
    const map={};
    (local[k]||[]).forEach(it=>{ if(it&&it.id) map[it.id]=it; });
    (remote[k]||[]).forEach(it=>{ if(!it||!it.id) return; const ex=map[it.id];
      if(!ex) map[it.id]=it;
      else { const a=new Date(ex.updatedAt||ex.createdAt||0), b=new Date(it.updatedAt||it.createdAt||0); if(b>a) map[it.id]=it; } });
    out[k]=Object.values(map).filter(it=>{ const t=td[it.id]; if(!t) return true; const u=new Date(it.updatedAt||it.createdAt||0); return u>new Date(t); });
  });
  // Merge chip tombstones (latest wins per value), then union the chip lists minus anything tombstoned.
  const dc={};
  [local._deletedChips||{}, remote._deletedChips||{}].forEach(src=>{ for(const k in src){ dc[k]=dc[k]||{}; for(const v in src[k]){ if(!dc[k][v] || new Date(src[k][v])>new Date(dc[k][v])) dc[k][v]=src[k][v]; } } });
  out._deletedChips=dc;
  ["commonSymptoms","commonMoods","commonSoul"].forEach(k=>{
    const m=new Map(); (local[k]||[]).concat(remote[k]||[]).forEach(v=>{ if(v&&!m.has(String(v).toLowerCase())) m.set(String(v).toLowerCase(),v); });
    const tomb=dc[k]||{};
    out[k]=[...m.values()].filter(v=>!tomb[String(v).toLowerCase()]);
  });
  out.weightUnit = local.weightUnit || remote.weightUnit || "lb";
  return out;
}

function ensureTokenClient(){
  if(tokenClient) return tokenClient;
  const cid=getClientId(); if(!cid) return null;
  if(!(window.google && google.accounts && google.accounts.oauth2)) return null;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: cid,
    scope: "https://www.googleapis.com/auth/drive.file",
    callback: (resp)=>{
      if(resp && resp.access_token){ accessToken=resp.access_token; tokenExpiry=Date.now()+((resp.expires_in||3600)*1000);
        if(SYNC._resolve){ const r=SYNC._resolve; SYNC._resolve=SYNC._reject=null; r(accessToken); } }
      else if(SYNC._reject){ const r=SYNC._reject; SYNC._resolve=SYNC._reject=null; r(new Error(resp&&resp.error||"sign-in failed")); }
    },
    error_callback: (err)=>{
      if(SYNC._reject){ const r=SYNC._reject; SYNC._resolve=SYNC._reject=null;
        const t=err&&err.type;
        r(new Error(t==="popup_closed"?"Sign-in window closed — tap Connect again":(t==="popup_failed_to_open"?"Pop-up was blocked — allow pop-ups, then Connect":(t||"sign-in failed")))); }
    },
  });
  return tokenClient;
}
function getToken(interactive){
  return new Promise((resolve,reject)=>{
    if(accessToken && Date.now()<tokenExpiry-60000){ resolve(accessToken); return; }
    const tc=ensureTokenClient();
    if(!tc){ reject(new Error("Google sign-in isn’t ready yet")); return; }
    let done=false;
    const to=setTimeout(()=>{ if(done) return; done=true; SYNC._resolve=SYNC._reject=null; reject(new Error("Sign-in didn’t finish — tap Connect again")); }, 60000);
    SYNC._resolve=(t)=>{ if(done) return; done=true; clearTimeout(to); resolve(t); };
    SYNC._reject=(e)=>{ if(done) return; done=true; clearTimeout(to); reject(e); };
    try{ tc.requestAccessToken({prompt: interactive?"consent":""}); }catch(e){ if(!done){ done=true; clearTimeout(to); SYNC._resolve=SYNC._reject=null; reject(e); } }
  });
}
async function driveFetch(url,opts){
  if(!accessToken) throw new Error("Not connected");
  opts=opts||{}; opts.headers=Object.assign({}, opts.headers||{}, {Authorization:"Bearer "+accessToken});
  const res=await fetch(url,opts);
  if(res.status===401){ accessToken=null; throw new Error("Google session expired — Connect again"); }
  if(!res.ok) throw new Error("Drive error "+res.status);
  return res;
}
async function driveFind(){
  const q=encodeURIComponent("name='"+DRIVE_FILE+"' and trashed=false");
  const res=await driveFetch("https://www.googleapis.com/drive/v3/files?spaces=drive&fields=files(id,modifiedTime)&q="+q);
  const j=await res.json(); return (j.files&&j.files[0])||null;
}
async function driveDownload(id){ const res=await driveFetch("https://www.googleapis.com/drive/v3/files/"+id+"?alt=media"); return await res.json(); }
async function driveCreate(data){
  const meta={name:DRIVE_FILE, mimeType:"application/json"};
  const b="hlb"+Math.random().toString(36).slice(2);
  const body="--"+b+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"+JSON.stringify(meta)+
    "\r\n--"+b+"\r\nContent-Type: application/json\r\n\r\n"+JSON.stringify(data)+"\r\n--"+b+"--";
  const res=await driveFetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",
    {method:"POST",headers:{"Content-Type":"multipart/related; boundary="+b},body});
  return (await res.json()).id;
}
async function driveUpdate(id,data){
  await driveFetch("https://www.googleapis.com/upload/drive/v3/files/"+id+"?uploadType=media",
    {method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
}

function setSyncStatus(s){ SYNC.status=s; if(TAB==="settings") renderSettings(); }
async function syncNow(interactive){
  if(syncing) return;
  if(!getClientId()){ if(interactive) toast("Paste your Google key first"); return; }
  syncing=true; setSyncStatus("syncing");
  try{
    await getToken(interactive);
    let file=await driveFind();
    if(file){ let remote=null; try{ remote=await driveDownload(file.id); }catch(e){}
      if(remote && typeof remote==="object"){ DB=mergeDB(DB, remote); save0(); }
      await driveUpdate(file.id, DB);
    } else {
      await driveCreate(DB);
    }
    localStorage.setItem("healthlog.connected","1");
    localStorage.setItem("healthlog.lastSync", nowISO());
    SYNC.connected=true; SYNC.status=null;
    if(interactive) requestPersistentStorage();
    render();
    if(interactive) toast("✓ Synced with Drive");
  }catch(e){
    SYNC.status="error:"+(e&&e.message||e);
    if(interactive) toast("⚠️ "+(e&&e.message||"Sync failed"));
    if(/expired|Not connected|sign-in/i.test(String(e&&e.message))) SYNC.connected=false;
  }finally{ syncing=false; if(TAB==="settings") renderSettings(); }
}
function scheduleSync(){
  if(!SYNC.connected) return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>syncNow(false), 2500);
}
function connectDrive(){ syncNow(true); }
function disconnectDrive(){ localStorage.removeItem("healthlog.connected"); SYNC.connected=false; accessToken=null; toast("Disconnected — data stays on this device"); if(TAB==="settings") renderSettings(); }
function saveClientId(){
  const el=document.getElementById("gcid"); if(!el) return;
  const v=el.value.trim();
  if(!/apps\.googleusercontent\.com/.test(v)){ toast("That doesn’t look like a Client ID"); return; }
  setClientId(v); tokenClient=null; toast("Key saved — now Connect"); renderSettings();
}
function initSyncOnBoot(){
  SYNC.connected = localStorage.getItem("healthlog.connected")==="1" && !!getClientId();
  if(!SYNC.connected) return;
  let n=0; const t=setInterval(()=>{ n++;
    if(window.google && google.accounts && google.accounts.oauth2){ clearInterval(t); syncNow(false); }
    else if(n>25){ clearInterval(t); }
  },300);
}
function syncCardHTML(){
  const cid=getClientId();
  const last=localStorage.getItem("healthlog.lastSync");
  const busy = SYNC.status==="syncing";
  if(!cid){
    return `<div class="insight card">
      <p class="ih">☁️ Sync across devices</p>
      <p class="sub" style="margin:0 0 8px">Keep your phone and laptop in step through <b>your own</b> Google Drive. One-time setup gives the app a “key.” Paste it here.</p>
      <input id="gcid" placeholder="…apps.googleusercontent.com" style="font-family:ui-monospace,monospace; font-size:13px" />
      <button class="btn primary small" style="margin-top:8px" onclick="saveClientId()">Save key</button>
      <p class="sub" style="margin:8px 2px 0">Need the key? Ask Claude for the Google setup steps.</p>
    </div>`;
  }
  if(!SYNC.connected){
    return `<div class="insight card">
      <p class="ih">☁️ Sync across devices</p>
      <p class="sub" style="margin:0 0 8px">Key saved. Connect to your Google Drive to turn on syncing.</p>
      <div class="inline">
        <button class="btn primary small" onclick="connectDrive()" ${busy?"disabled":""}>${busy?"Connecting…":"Connect Google Drive"}</button>
        <button class="btn ghost small" onclick="setClientId('');renderSettings()">Change key</button>
      </div>
      ${SYNC.status&&SYNC.status.startsWith("error")?`<p class="sub" style="color:var(--danger);margin:8px 2px 0">${esc(SYNC.status.slice(6))}</p>`:""}
    </div>`;
  }
  return `<div class="insight card" style="border-color:var(--good)">
    <p class="ih">☁️ Sync on — Google Drive</p>
    <p class="sub" style="margin:0 0 8px">${busy?"Syncing…":`Synced${last?` · last ${ago(last)}`:""}. Changes sync automatically.`}</p>
    <div class="inline">
      <button class="btn ghost small" onclick="syncNow(true)" ${busy?"disabled":""}>Sync now</button>
      <button class="btn ghost small" onclick="disconnectDrive()">Disconnect</button>
    </div>
    ${SYNC.status&&SYNC.status.startsWith("error")?`<p class="sub" style="color:var(--danger);margin:8px 2px 0">${esc(SYNC.status.slice(6))}</p>`:""}
  </div>`;
}

/* ============================================================
   WELCOME (first run) + FEEDBACK  (for beta testers)
   ============================================================ */
function hasAnyData(){
  return !!(DB.symptoms.length||DB.medDoses.length||DB.bp.length||DB.sleep.length||DB.meals.length||DB.moods.length||DB.soul.length||DB.weights.length);
}
function showWelcome(){
  const inner=`
    <p style="font-size:15px;line-height:1.55">A gentle, private place for your health — symptoms, meds, blood pressure, sleep, mood, soul time, weight, and the context around eating.</p>
    <div class="insight card" style="margin-top:12px;border-color:var(--good)">
      <p class="ih">🔒 Yours alone</p>
      <p class="sub" style="margin:0">Everything you log stays on <b>this device</b>. No account, no cloud, no one else can see it — not even whoever shared this with you.</p>
    </div>
    <ul style="font-size:14px;line-height:1.7;margin:12px 2px 0;padding-left:20px;color:var(--muted)">
      <li>Tap a module on the <b>Log</b> screen to add something — time defaults to “now.”</li>
      <li>Spot patterns in <b>Trends</b>; make a doctor-ready page in <b>Summary</b>.</li>
      <li><b>Install</b> it to your home screen (Settings) so it opens like an app, offline.</li>
    </ul>
    <div class="actions"><button class="btn primary" id="wok">Start</button></div>`;
  sheet("Welcome to Health Log 🌿", inner, (root,close)=>{
    root.querySelector("#wok").onclick=()=>{ try{localStorage.setItem("healthlog.welcomed","1");}catch(e){} requestPersistentStorage(); close(); };
  });
}
function maybeWelcome(){
  let seen; try{ seen=localStorage.getItem("healthlog.welcomed"); }catch(e){ return; }
  if(seen) return;
  if(hasAnyData()){ try{localStorage.setItem("healthlog.welcomed","1");}catch(e){} return; } // existing users: mark seen, no popup
  showWelcome();
}
function sendFeedback(){
  const note=`Health Log — feedback\n\n• What I liked:\n• What confused me:\n• What I'd change:\n\n— sent from the app (${isStandalone()?"installed":"browser"})`;
  if(navigator.share){ navigator.share({title:"Health Log feedback", text:note}).catch(()=>{}); return; }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(note).then(()=>toast("Copied — paste it in a text to Solenne 💛")).catch(()=>toast("Jot your thoughts & text them to Solenne 💛"));
  } else toast("Jot your thoughts & text them to Solenne 💛");
}

/* boot */
render();
initSyncOnBoot();
maybeWelcome();
requestPersistentStorage();
</script>
